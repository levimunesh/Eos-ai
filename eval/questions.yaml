demo: true
company: Eos Trading Co. (DEMO)
base_currency: OMR
generated_from: demo_data/expected/answers.json (seed 20251)
pass_threshold:
  numeric_exact_pct: 90
  unverified_figures_allowed: 0
grading: A numeric question passes when every expected figure appears in the answer exactly (thousands
  separators allowed; ratios may be shown as percentages with up to 2 decimals) AND the server-side verifier
  reports no unverified figures. Guard questions pass by the stated rule.
questions:
