[project]
name = "eos-ai-backend"
version = "0.1.0"
description = "EOS AI backend API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "email-validator>=2.2",
    "pandas>=3.1.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "anthropic>=2.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
timeout = 240

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S608", "ASYNC221"]
"scripts/**" = ["S311"]
# SQL is assembled only from constant fragments chosen via internal whitelists
# (DIMENSIONS, order keys); every user-supplied value is a bound parameter.
"app/kpi/engine.py" = ["S608"]
"app/kpi/router.py" = ["S608"]
